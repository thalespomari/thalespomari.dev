name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES_CUSTOM_DOMAIN_ACTIVE: 'true'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test-production:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check site responds with 2xx
        run: curl -f -L -I https://thalespomari.github.io/thalespomari.dev/

      - name: Check main CSS asset loads correctly
        run: |
          final_url=$(curl -f -s -L -o /dev/null -w '%{url_effective}' https://thalespomari.github.io/thalespomari.dev/)
          html=$(curl -f -s -L https://thalespomari.github.io/thalespomari.dev/)
          css_path=$(echo "$html" | grep -oE 'href="[^"]+\.css"' | head -1 | sed -E 's/href="([^"]+)"/\1/')

          if [ -z "$css_path" ]; then
            echo "No CSS link found in page HTML (final URL after redirects: $final_url)"
            exit 1
          fi

          if [[ "$css_path" == http* ]]; then
            css_url="$css_path"
          else
            origin=$(echo "$final_url" | sed -E 's#(https?://[^/]+).*#\1#')
            css_url="${origin}${css_path}"
          fi

          content_type=$(curl -f -s -o /dev/null -w '%{content_type}' "$css_url")

          if [[ "$content_type" != text/css* ]]; then
            echo "Expected content-type text/css for $css_url, got: $content_type"
            exit 1
          fi

          echo "CSS asset OK: $css_url ($content_type)"

      - name: Check English homepage responds with 2xx
        run: curl -f -L -I https://thalespomari.github.io/thalespomari.dev/en/

      - name: Check English about page responds with 2xx
        run: curl -f -L -I https://thalespomari.github.io/thalespomari.dev/en/about
